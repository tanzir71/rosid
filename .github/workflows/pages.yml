name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - tool/prepare_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Find latest distributable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No GitHub Release exists yet; the release workflow will perform the first Pages deployment."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern release-metadata.json \
            --dir release-metadata
          test -s release-metadata/release-metadata.json
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Prepare site with latest release metadata
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          metadata=release-metadata/release-metadata.json
          python3 tool/prepare_site.py \
            --output site-dist \
            --repository "$GITHUB_REPOSITORY" \
            --version "$(jq -er '.version' "$metadata")" \
            --release-date "$(jq -er '.release_date' "$metadata")" \
            --release-tag "$(jq -er '.tag_name' "$metadata")" \
            --apk-size "$(jq -er '.apk_size' "$metadata")" \
            --apk-sha256 "$(jq -er '.apk_sha256' "$metadata")" \
            --certificate-sha256 "$(jq -er '.certificate_sha256' "$metadata")" \
            --ios-size "$(jq -er '.ios_size' "$metadata")" \
            --ios-sha256 "$(jq -er '.ios_sha256' "$metadata")"
      - if: steps.release.outputs.available == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - if: steps.release.outputs.available == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-dist
      - if: steps.release.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
