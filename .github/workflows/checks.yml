name: Checks

on:
  pull_request:
  push:
    branches: [main, codex/v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Verify pinned V2 Python runtime
        run: python -c "import platform; assert platform.python_version() == '3.12.10'"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Restore locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: dart run tool/generate_ocr_fixture_bundle.dart
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test
      - name: Audit iOS dependency privacy
        run: |
          python3 -m unittest tool.test_audit_ios_privacy
          python3 tool/audit_ios_privacy.py
      - name: Test V2 structural model-audit primitives
        run: |
          python -m unittest tool.test_audit_v2_model
          python -m unittest discover -s ml/tests -v
      - name: Validate static release site
        run: |
          python3 -m py_compile tool/prepare_site.py
          python3 tool/prepare_site.py \
            --output "$RUNNER_TEMP/rosid-site" \
            --repository "$GITHUB_REPOSITORY" \
            --version "1.0.0+1" \
            --release-date "2026-07-18" \
            --release-tag "v1.0.0" \
            --apk-size "143.1 MB" \
            --apk-sha256 "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
            --certificate-sha256 "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB" \
            --ios-size "92.4 MB" \
            --ios-sha256 "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"
      - run: flutter build apk --debug
      # Debug builds add INTERNET for the Flutter VM service. The release job
      # performs the strict merged-manifest audit on the distributable variant.
      - name: Run portable offline audit without ripgrep
        env:
          ROSID_FORCE_GREP: '1'
        run: tool/audit_offline.sh
