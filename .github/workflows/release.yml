name: Mobile Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      pubspec_version: ${{ steps.version.outputs.pubspec_version }}
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Verify release commit is on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" \
            "+refs/heads/main:refs/remotes/origin/main"

          tag_commit="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $checked_out_commit does not match tag $GITHUB_REF_NAME ($tag_commit)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $tag_commit, which is not contained in origin/main."
            exit 1
          fi
      - name: Verify release tag matches pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          if [[ ! "$pubspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version must use numeric MAJOR.MINOR.PATCH+BUILD form."
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH with optional numeric build metadata."
            exit 1
          fi

          build_name="${pubspec_version%%+*}"
          build_number="${pubspec_version##*+}"

          tag_version="${GITHUB_REF_NAME#v}"
          tag_build_name="${tag_version%%+*}"
          if [ "$tag_build_name" != "$build_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $build_name."
            exit 1
          fi
          if [[ "$tag_version" == *+* ]] && [ "${tag_version##*+}" != "$build_number" ]; then
            echo "::error::Tag build metadata does not match pubspec build number $build_number."
            exit 1
          fi

          {
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "pubspec_version=$pubspec_version"
            echo "release_date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: android-release
    outputs:
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
      certificate_sha256: ${{ steps.verify.outputs.certificate_sha256 }}
      apk_size: ${{ steps.verify.outputs.apk_size }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Verify pinned offline OCR language assets
        env:
          ENG_TESSDATA_SHA256: 8280AED0782FE27257A68EA10FE7EF324CA0F8D85BD2FD145D1C2B560BCB66BA
          BEN_TESSDATA_SHA256: 1CD0129288D1F74F6661C35E638E487BD146A66BB732ECD9E011E48DCB0DF623
        shell: bash
        run: |
          set -euo pipefail
          eng_sha256="$(sha256sum assets/tessdata/eng.traineddata | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          ben_sha256="$(sha256sum assets/tessdata/ben.traineddata | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          if [ "$eng_sha256" != "$ENG_TESSDATA_SHA256" ] || [ "$ben_sha256" != "$BEN_TESSDATA_SHA256" ]; then
            echo "::error::Checked-in OCR assets do not match their pinned SHA-256 values."
            exit 1
          fi
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/rosid-release.jks
          {
            echo "storeFile=rosid-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Restore locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Android APK
        env:
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"
      - name: Audit and verify Android release
        id: verify
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tool/audit_offline.sh --require-merged
          cp build/app/outputs/flutter-apk/app-release.apk rosid.apk

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          apksigner_path="$(find "$android_sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          verify_output="$("$apksigner_path" verify --verbose --print-certs rosid.apk)"
          printf '%s\n' "$verify_output"

          signer_count="$(printf '%s\n' "$verify_output" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/{count++} END{print count+0}')"
          if [ "$signer_count" -ne 1 ]; then
            echo "::error::Expected exactly one APK signing certificate, found $signer_count."
            exit 1
          fi
          apk_certificate_sha256="$(
            printf '%s\n' "$verify_output" |
              awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/{print $2; exit}' |
              tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:'
          )"
          keystore_certificate_sha256="$(
            keytool -list -v -keystore android/app/rosid-release.jks \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" |
              awk -F ': ' '/SHA256:/{print $2; exit}' |
              tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:'
          )"
          if [ "$apk_certificate_sha256" != "$keystore_certificate_sha256" ]; then
            echo "::error::APK signer does not match the configured release keystore."
            exit 1
          fi

          apk_sha256_lower="$(sha256sum rosid.apk | cut -d' ' -f1)"
          apk_sha256="$(printf '%s' "$apk_sha256_lower" | tr '[:lower:]' '[:upper:]')"
          apk_size="$(python3 -c 'import os; n=os.path.getsize("rosid.apk"); print(f"{n / 1024 / 1024:.1f} MB")')"
          printf '%s  rosid.apk\n' "$apk_sha256_lower" > rosid.apk.sha256
          printf '%s\n' "$apk_certificate_sha256" > certificate-sha256.txt
          {
            echo "apk_sha256=$apk_sha256"
            echo "certificate_sha256=$apk_certificate_sha256"
            echo "apk_size=$apk_size"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: |
            rosid.apk
            rosid.apk.sha256
            certificate-sha256.txt
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: prepare
    runs-on: macos-15
    outputs:
      ios_sha256: ${{ steps.package.outputs.ios_sha256 }}
      ios_size: ${{ steps.package.outputs.ios_size }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Pin CocoaPods
        run: |
          sudo gem install cocoapods -v 1.17.0 --no-document
          test "$(pod --version)" = "1.17.0"
      - name: Restore locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Verify committed CocoaPods resolution
        working-directory: ios
        run: |
          test -f Podfile.lock
          pod install
          git diff --exit-code -- Podfile.lock
          test -z "$(git status --porcelain -- Podfile.lock)"
      - name: Audit resolved iOS dependency privacy
        run: python3 tool/audit_ios_privacy.py
      - name: Compile unsigned iPhone app
        env:
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"
      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/ios/iphoneos/Runner.app"
          test -d "$app_path"
          if [ -d "$app_path/_CodeSignature" ]; then
            echo "::error::The no-codesign build unexpectedly contains a code signature."
            exit 1
          fi
          mkdir Payload
          cp -R "$app_path" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload rosid-ios-unsigned.ipa

          ios_sha256_lower="$(shasum -a 256 rosid-ios-unsigned.ipa | cut -d' ' -f1)"
          ios_sha256="$(printf '%s' "$ios_sha256_lower" | tr '[:lower:]' '[:upper:]')"
          ios_size="$(python3 -c 'import os; n=os.path.getsize("rosid-ios-unsigned.ipa"); print(f"{n / 1024 / 1024:.1f} MB")')"
          printf '%s  rosid-ios-unsigned.ipa\n' "$ios_sha256_lower" > rosid-ios-unsigned.ipa.sha256
          cat > IOS-UNSIGNED-README.txt <<'EOF'
          This IPA is unsigned and cannot be installed by tapping it on an iPhone.
          It must be signed by the user with their own Apple Account. Free personal
          provisioning normally expires after 7 days. See docs/IOS_SELF_SIGNING.md.
          EOF
          {
            echo "ios_sha256=$ios_sha256"
            echo "ios_size=$ios_size"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release
          path: |
            rosid-ios-unsigned.ipa
            rosid-ios-unsigned.ipa.sha256
            IOS-UNSIGNED-README.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ needs.android.outputs.apk_sha256 }}
          CERTIFICATE_SHA256: ${{ needs.android.outputs.certificate_sha256 }}
          IOS_SHA256: ${{ needs.ios.outputs.ios_sha256 }}
          APK_SIZE: ${{ needs.android.outputs.apk_size }}
          IOS_SIZE: ${{ needs.ios.outputs.ios_size }}
          PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Rosid ${GITHUB_REF_NAME}

          Private, fully offline Bangla and English receipt/document scanning.

          ### Android

          - Signed APK: \`rosid.apk\`
          - APK SHA-256: \`$APK_SHA256\`
          - Signing certificate SHA-256: \`$CERTIFICATE_SHA256\`

          ### iPhone (advanced, self-signing only)

          - Unsigned package: \`rosid-ios-unsigned.ipa\`
          - IPA SHA-256: \`$IOS_SHA256\`
          - This is not a one-tap install, App Store build, or TestFlight build. It
            must be signed by the user with their own Apple Account. Free personal
            provisioning normally expires after 7 days.

          ### V1 status

          Automated tests and release-manifest audits passed in this tag workflow.
          The tagged V1 baseline separately records local R8 and Android-emulator
          OCR evidence. Broad physical-device QA is owner-deferred.
          Printed Bangla and English are the supported OCR focus; handwriting is
          best effort and should be reviewed before saving.
          EOF
          jq -n \
            --arg version "$PUBSPEC_VERSION" \
            --arg tag_name "$GITHUB_REF_NAME" \
            --arg release_date "$RELEASE_DATE" \
            --arg apk_size "$APK_SIZE" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg certificate_sha256 "$CERTIFICATE_SHA256" \
            --arg ios_size "$IOS_SIZE" \
            --arg ios_sha256 "$IOS_SHA256" \
            '{
              version: $version,
              tag_name: $tag_name,
              release_date: $release_date,
              apk_size: $apk_size,
              apk_sha256: $apk_sha256,
              certificate_sha256: $certificate_sha256,
              ios_size: $ios_size,
              ios_sha256: $ios_sha256
            }' > release-metadata.json
          gh release create "$GITHUB_REF_NAME" \
            release-assets/rosid.apk \
            release-assets/rosid.apk.sha256 \
            release-assets/certificate-sha256.txt \
            release-assets/rosid-ios-unsigned.ipa \
            release-assets/rosid-ios-unsigned.ipa.sha256 \
            release-assets/IOS-UNSIGNED-README.txt \
            release-metadata.json \
            --verify-tag \
            --title "Rosid ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
      - name: Verify GitHub Release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          immutable="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.immutable')"
          if [ "$immutable" != "true" ]; then
            echo "::error::Published release ${GITHUB_REF_NAME} is not immutable."
            exit 1
          fi

  deploy-pages:
    needs: [prepare, android, ios, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Prepare release-specific site
        run: >-
          python3 tool/prepare_site.py
          --output site-dist
          --repository "$GITHUB_REPOSITORY"
          --version "${{ needs.prepare.outputs.pubspec_version }}"
          --release-date "${{ needs.prepare.outputs.release_date }}"
          --release-tag "$GITHUB_REF_NAME"
          --apk-size "${{ needs.android.outputs.apk_size }}"
          --apk-sha256 "${{ needs.android.outputs.apk_sha256 }}"
          --certificate-sha256 "${{ needs.android.outputs.certificate_sha256 }}"
          --ios-size "${{ needs.ios.outputs.ios_size }}"
          --ios-sha256 "${{ needs.ios.outputs.ios_sha256 }}"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
