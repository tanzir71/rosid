name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment:
      name: android-release
    outputs:
      certificate_sha256: ${{ steps.verify_apk.outputs.certificate_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify release tag matches pubspec version
        run: |
          pubspec_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "::error::pubspec.yaml does not declare a version."
            exit 1
          fi

          build_name="${pubspec_version%%+*}"
          if [ "$build_name" = "$pubspec_version" ]; then
            echo "::error::The pubspec version must include a numeric build number (for example, 1.0.0+1)."
            exit 1
          fi
          build_number="${pubspec_version##*+}"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "::error::The pubspec build number must be numeric."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          tag_build_name="${tag_version%%+*}"
          if [ "$tag_build_name" != "$build_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version name $build_name."
            exit 1
          fi
          if [[ "$tag_version" == *+* ]]; then
            tag_build_number="${tag_version##*+}"
            if [ "$tag_build_number" != "$build_number" ]; then
              echo "::error::Tag build metadata $tag_build_number does not match pubspec build number $build_number."
              exit 1
            fi
          fi

          {
            echo "ROSID_BUILD_NAME=$build_name"
            echo "ROSID_BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Verify pinned offline OCR language assets
        env:
          ENG_TESSDATA_SHA256: 8280AED0782FE27257A68EA10FE7EF324CA0F8D85BD2FD145D1C2B560BCB66BA
          BEN_TESSDATA_SHA256: 1CD0129288D1F74F6661C35E638E487BD146A66BB732ECD9E011E48DCB0DF623
        run: |
          eng_sha256="$(sha256sum assets/tessdata/eng.traineddata | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          ben_sha256="$(sha256sum assets/tessdata/ben.traineddata | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          if [ "$eng_sha256" != "$ENG_TESSDATA_SHA256" ] || [ "$ben_sha256" != "$BEN_TESSDATA_SHA256" ]; then
            echo "::error::Checked-in OCR language assets do not match their pinned SHA-256 values."
            exit 1
          fi
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/rosid-release.jks
          {
            echo "storeFile=rosid-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-name "$ROSID_BUILD_NAME" --build-number "$ROSID_BUILD_NUMBER"
      - name: Audit, verify signer, and name artifact
        id: verify_apk
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          tool/audit_offline.sh --require-merged
          cp build/app/outputs/flutter-apk/app-release.apk rosid.apk

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$android_sdk" ]; then
            echo "::error::ANDROID_SDK_ROOT or ANDROID_HOME must identify the Android SDK."
            exit 1
          fi
          apksigner_path="$(find "$android_sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ] || [ ! -x "$apksigner_path" ]; then
            echo "::error::Could not find an executable apksigner in $android_sdk/build-tools."
            exit 1
          fi

          verify_output="$("$apksigner_path" verify --verbose --print-certs rosid.apk)"
          printf '%s\n' "$verify_output"
          signer_count="$(printf '%s\n' "$verify_output" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/{count++} END{print count+0}')"
          if [ "$signer_count" -ne 1 ]; then
            echo "::error::Expected exactly one APK signing certificate, found $signer_count."
            exit 1
          fi

          apk_certificate_sha256="$(
            printf '%s\n' "$verify_output" \
              | awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/{print $2; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"
          keystore_certificate_sha256="$(
            keytool -list -v \
              -keystore android/app/rosid-release.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | awk -F ': ' '/SHA256:/{print $2; exit}' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]:'
          )"
          if [ -z "$apk_certificate_sha256" ] || [ -z "$keystore_certificate_sha256" ]; then
            echo "::error::Could not extract both SHA-256 signing certificate fingerprints."
            exit 1
          fi
          if [ "$apk_certificate_sha256" != "$keystore_certificate_sha256" ]; then
            echo "::error::APK signer SHA-256 does not match the configured release keystore."
            echo "APK:      $apk_certificate_sha256"
            echo "Keystore: $keystore_certificate_sha256"
            exit 1
          fi

          sha256sum rosid.apk > rosid.apk.sha256
          printf '%s\n' "$apk_certificate_sha256" > certificate-sha256.txt
          printf 'certificate_sha256=%s\n' "$apk_certificate_sha256" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rosid ${GITHUB_REF_NAME}"
            echo
            echo "Fully offline Android APK with bundled English and Bangla OCR data."
            echo
            echo "APK SHA-256: \`$(cut -d' ' -f1 rosid.apk.sha256)\`"
            echo "Signing certificate SHA-256: \`$(cat certificate-sha256.txt)\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" rosid.apk rosid.apk.sha256 certificate-sha256.txt --title "Rosid ${GITHUB_REF_NAME}" --notes-file release-notes.md

  deploy-pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Prepare release-specific site
        env:
          CERTIFICATE_SHA256: ${{ needs.release.outputs.certificate_sha256 }}
        run: |
          if [[ ! "$CERTIFICATE_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Release signing certificate SHA-256 is missing or malformed."
            exit 1
          fi
          cp -R site site-dist
          pubspec_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          test -n "$pubspec_version"
          grep -q 'ROSID_CERTIFICATE_SHA256_PLACEHOLDER' site-dist/index.html
          grep -q 'ROSID_VERSION_PLACEHOLDER' site-dist/index.html
          sed -i "s#OWNER/REPO#${GITHUB_REPOSITORY}#g" site-dist/index.html
          sed -i "s#ROSID_CERTIFICATE_SHA256_PLACEHOLDER#${CERTIFICATE_SHA256}#g" site-dist/index.html
          sed -i "s#ROSID_VERSION_PLACEHOLDER#${pubspec_version}#g" site-dist/index.html
          if grep -qE 'OWNER/REPO|ROSID_(CERTIFICATE_SHA256|VERSION)_PLACEHOLDER' site-dist/index.html; then
            echo "::error::Site deployment still contains an unresolved release placeholder."
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
