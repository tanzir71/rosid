name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Add pinned offline OCR language assets
        env:
          TESSDATA_REVISION: e12c65a915945e4c28e237a9b52bc4a8f39a0cec
        run: |
          curl --fail --location --retry 3 --output assets/tessdata/eng.traineddata "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/${TESSDATA_REVISION}/eng.traineddata"
          curl --fail --location --retry 3 --output assets/tessdata/ben.traineddata "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/${TESSDATA_REVISION}/ben.traineddata"
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/rosid-release.jks
          {
            echo "storeFile=rosid-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}"
      - name: Audit and name artifact
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          tool/audit_offline.sh
          cp build/app/outputs/flutter-apk/app-release.apk rosid.apk
          sha256sum rosid.apk > rosid.apk.sha256
          keytool -list -v -keystore android/app/rosid-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F ': ' '/SHA256:/{print $2; exit}' > certificate-sha256.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Rosid ${GITHUB_REF_NAME}"
            echo
            echo "Fully offline Android APK with bundled English and Bangla OCR data."
            echo
            echo "APK SHA-256: \`$(cut -d' ' -f1 rosid.apk.sha256)\`"
            echo "Signing certificate SHA-256: \`$(cat certificate-sha256.txt)\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" rosid.apk rosid.apk.sha256 certificate-sha256.txt --title "Rosid ${GITHUB_REF_NAME}" --notes-file release-notes.md
