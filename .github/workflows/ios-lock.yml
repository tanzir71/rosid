name: Refresh iOS dependency lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Pin CocoaPods
        run: |
          sudo gem install cocoapods -v 1.17.0 --no-document
          test "$(pod --version)" = "1.17.0"
      - name: Restore locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Resolve CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Audit resolved iOS dependency privacy
        run: python3 tool/audit_ios_privacy.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7
